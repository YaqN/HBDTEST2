<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My GitHub Pages Theater</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="backdrop"></div>
  <main class="app">
    <header class="topbar">
      <div class="brand">GHFLIX</div>
      <div class="controls" aria-label="Username controls">
        <input id="username" type="text" placeholder="GitHub username" autocomplete="off" />
        <button id="loadBtn" type="button">Load Library</button>
      </div>
    </header>

    <section class="hero" id="hero" aria-live="polite">
      <h1 id="heroTitle">Your GitHub Websites, Netflix Style</h1>
      <p id="heroText">Enter your username to build a clickable catalog of your published projects.</p>
      <div class="hero-actions">
        <button id="openFeatured" type="button" class="secondary" disabled>Open Featured Site</button>
      </div>
    </section>

    <section id="status" class="status" aria-live="polite"></section>

    <section class="row-block">
      <h2>Featured Websites</h2>
      <div id="featuredRow" class="row"></div>
    </section>

    <section class="row-block">
      <h2>GitHub Pages</h2>
      <div id="pagesRow" class="row"></div>
    </section>

    <section class="row-block">
      <h2>Custom Homepages</h2>
      <div id="homepagesRow" class="row"></div>
    </section>
  </main>

  <template id="siteCardTemplate">
    <article class="site-card" tabindex="0" role="button">
      <div class="site-card__thumb"></div>
      <div class="site-card__meta">
        <h3 class="site-card__title"></h3>
        <p class="site-card__desc"></p>
        <span class="site-card__type"></span>
      </div>
    </article>
  </template>

  <script src="js/index.js"></script>
</body>
</html>
